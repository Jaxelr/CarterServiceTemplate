name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Format Code
      run: dotnet format analyzers Content/CarterService.sln --verbosity diagnostic
    - name: Build
      run: dotnet build Content/CarterService.sln --configuration Release
    - name: Test
      working-directory: Content
      run: dotnet test --project tests/CarterService.Tests.csproj --configuration Release --no-build
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
